name: Release Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from plugin.cfg
        id: version
        run: |
          VERSION=$(grep 'version=' addons/godot_mini_game/plugin.cfg | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match plugin.cfg (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Package plugin
        run: scripts/package_plugin.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          body: |
            ## Godot Mini Game Plugin v${{ steps.version.outputs.version }}

            ### Installation
            1. Download `godot_mini_game_v${{ steps.version.outputs.version }}.zip`
            2. Extract into your Godot project root
            3. Enable the plugin in Project Settings > Plugins

            Do not download GitHub's auto-generated Source code archives for plugin installation.

            Includes bundled engine template for Godot 4.6 (mini-game compatible).
          files: |
            dist/godot_mini_game_v${{ steps.version.outputs.version }}.zip
