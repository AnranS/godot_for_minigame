name: Build Mini-Game WASM Template

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Exact Godot tag, for example 4.6.1-stable"
        required: true
        type: string
        default: "4.6.1-stable"
      emscripten_version:
        description: "Exact Emscripten SDK version"
        required: true
        type: string
        default: "4.0.3"
      template_revision:
        description: "Immutable template revision"
        required: true
        type: string
        default: "2"
      publish_release:
        description: "Publish after every validation passes"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GODOT_TAG: ${{ inputs.godot_version }}
      EMSDK_VERSION: ${{ inputs.emscripten_version }}
      TEMPLATE_REVISION: ${{ inputs.template_revision }}
      BUILD_PROFILE: 2d_full
      BUILD_TARGET: release
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7

      - name: Validate immutable inputs
        id: contract
        run: |
          set -euo pipefail
          if ! [[ "$GODOT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+$ ]]; then
            echo "Godot tag must be exact, for example 4.6.1-stable: $GODOT_TAG" >&2
            exit 1
          fi
          if ! [[ "$EMSDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Emscripten SDK version must be exact, for example 4.0.3: $EMSDK_VERSION" >&2
            exit 1
          fi
          if ! [[ "$TEMPLATE_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Template revision must be a positive integer: $TEMPLATE_REVISION" >&2
            exit 1
          fi
          bridge_abi=$(jq -er '.bridgeAbi | select(type == "number" and . > 0 and (. % 1 == 0))' support-matrix.json)
          template_schema=$(jq -er '.templateSchema | select(type == "number" and . > 0 and (. % 1 == 0))' support-matrix.json)
          release_tag="template-${GODOT_TAG}-emsdk-${EMSDK_VERSION}-2d-full-release-abi-${bridge_abi}-r${TEMPLATE_REVISION}"
          echo "bridge_abi=$bridge_abi" >> "$GITHUB_OUTPUT"
          echo "template_schema=$template_schema" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Godot source tag
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ inputs.godot_version }}
          path: godot-src

      - name: Verify source identity
        id: source
        working-directory: godot-src
        run: |
          set -euo pipefail
          actual_tag=$(git describe --tags --exact-match)
          if [ "$actual_tag" != "$GODOT_TAG" ]; then
            echo "Checked-out tag $actual_tag does not match requested version $GODOT_TAG" >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read official editor commit
        id: editor
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          # Official binaries can be built from a commit other than the tag;
          # record what they report so the exporter can accept those editors.
          editor_commit=$(scripts/official_editor_commit.sh "$GODOT_TAG")
          if [ "$editor_commit" = "$SOURCE_COMMIT" ]; then
            editor_commits='[]'
          else
            editor_commits=$(jq -cn --arg commit "$editor_commit" '[$commit]')
            echo "Official ${GODOT_TAG} editors report ${editor_commit}; tag commit is ${SOURCE_COMMIT}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "commits=$editor_commits" >> "$GITHUB_OUTPUT"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ inputs.emscripten_version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          pip install scons==4.9.1
          sudo apt-get update
          sudo apt-get install -y brotli jq wabt

      - name: Enforce mini-game longjmp mode
        working-directory: godot-src
        run: |
          set -euo pipefail
          detect_py=platform/web/detect.py
          if grep -q "SUPPORT_LONGJMP='emscripten'" "$detect_py"; then
            expected_change=""
          elif grep -q "SUPPORT_LONGJMP='wasm'" "$detect_py"; then
            sed -i "s/SUPPORT_LONGJMP='wasm'/SUPPORT_LONGJMP='emscripten'/g" "$detect_py"
            expected_change="$detect_py"
          else
            echo "Godot source has an unknown SUPPORT_LONGJMP configuration" >&2
            exit 1
          fi
          grep -q "SUPPORT_LONGJMP='emscripten'" "$detect_py"
          changed_files=$(git diff --name-only)
          if [ "$changed_files" != "$expected_change" ]; then
            echo "Unexpected Godot source changes: ${changed_files:-<none>}" >&2
            exit 1
          fi

      - name: Build exact 2D full template
        working-directory: godot-src
        run: |
          scons platform=web target=template_release \
            arch=wasm32 \
            optimize=size \
            wasm_simd=no \
            threads=no \
            dlink_enabled=no \
            javascript_eval=no \
            module_webrtc_enabled=no \
            module_webxr_enabled=no \
            module_openxr_enabled=no \
            -j"$(nproc)"

      - name: Extract packaged web template
        id: artifacts
        run: |
          set -euo pipefail
          # Godot 4.6 leaves .js, .engine.js and .wrapped.js in bin/. Only the
          # godot.js inside the packaged web template is what the exporter ships.
          shopt -s nullglob
          archives=(godot-src/bin/godot.web.template_release.wasm32*.zip)
          shopt -u nullglob
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one packaged web template archive (%s): %s\n' "${#archives[@]}" "${archives[*]:-<none>}" >&2
            exit 1
          fi
          mkdir -p engine-artifacts
          unzip -p "${archives[0]}" godot.js > engine-artifacts/godot.js
          unzip -p "${archives[0]}" godot.wasm > engine-artifacts/godot.wasm
          test -s engine-artifacts/godot.js
          test -s engine-artifacts/godot.wasm
          echo "js=engine-artifacts/godot.js" >> "$GITHUB_OUTPUT"
          echo "wasm=engine-artifacts/godot.wasm" >> "$GITHUB_OUTPUT"

      - name: Assemble versioned template bundle
        id: bundle
        env:
          GODOT_COMMIT: ${{ steps.source.outputs.commit }}
          EDITOR_COMMITS: ${{ steps.editor.outputs.commits }}
          BRIDGE_ABI: ${{ steps.contract.outputs.bridge_abi }}
          TEMPLATE_SCHEMA: ${{ steps.contract.outputs.template_schema }}
        run: |
          set -euo pipefail
          mkdir -p template-package
          cp "${{ steps.artifacts.outputs.js }}" template-package/godot.js
          cp godot-src/COPYRIGHT.txt template-package/GODOT_COPYRIGHT.txt
          brotli --quality=11 --force --output=template-package/godot.wasm.br "${{ steps.artifacts.outputs.wasm }}"
          canonical_version="${GODOT_TAG//-/.}"
          printf '%s\n' "$canonical_version" > template-package/version.txt
          js_sha=$(sha256sum template-package/godot.js | cut -d' ' -f1)
          wasm_sha=$(sha256sum template-package/godot.wasm.br | cut -d' ' -f1)
          jq -n \
            --arg version "$canonical_version" \
            --arg commit "$GODOT_COMMIT" \
            --arg emscripten "$EMSDK_VERSION" \
            --arg js_sha "$js_sha" \
            --arg wasm_sha "$wasm_sha" \
            --argjson schema "$TEMPLATE_SCHEMA" \
            --argjson revision "$TEMPLATE_REVISION" \
            --argjson bridge_abi "$BRIDGE_ABI" \
            --argjson editor_commits "$EDITOR_COMMITS" \
            '{
              schema: $schema,
              godot: ({version: $version, commit: $commit}
                + (if ($editor_commits | length) > 0 then {editorCommits: $editor_commits} else {} end)),
              emscriptenVersion: $emscripten,
              profile: "2d_full",
              target: "release",
              revision: $revision,
              bridgeAbi: $bridge_abi,
              features: {simd: false, threads: false, wasmExceptions: false},
              artifacts: {
                "godot.js": {sha256: $js_sha},
                "godot.wasm.br": {sha256: $wasm_sha}
              }
            }' > template-package/template.json
          find template-package -type f -exec chmod 0644 {} +
          find template-package -type f -exec touch -t 198001010000 {} +
          bundle="godot_minigame_template_${GODOT_TAG}_emsdk-${EMSDK_VERSION}_2d-full_release_abi-${BRIDGE_ABI}_r${TEMPLATE_REVISION}.zip"
          rm -f "$bundle" "${bundle}.sha256"
          (cd template-package && zip -X -9 "../$bundle" godot.js godot.wasm.br version.txt template.json GODOT_COPYRIGHT.txt)
          sha256sum "$bundle" > "${bundle}.sha256"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "name=${bundle%.zip}" >> "$GITHUB_OUTPUT"

      - name: Validate template bundle with the shared verifier
        env:
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail
          scripts/verify_wasm_template.sh "$BUNDLE_PATH"
          bundle_dir=$(dirname "$BUNDLE_PATH")
          bundle_name=$(basename "$BUNDLE_PATH")
          (cd "$bundle_dir" && sha256sum -c "${bundle_name}.sha256")
          unzip -t "$BUNDLE_PATH"

      - name: Upload validated artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            ${{ steps.bundle.outputs.path }}
            ${{ steps.bundle.outputs.path }}.sha256

      - name: Refuse mutable template release
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ steps.contract.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Template tag $RELEASE_TAG already exists locally and is immutable" >&2
            exit 1
          fi
          if ! remote_refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}"); then
            echo "Unable to verify whether remote template tag $RELEASE_TAG exists" >&2
            exit 1
          fi
          if [ -n "$remote_refs" ]; then
            echo "Template tag $RELEASE_TAG already exists remotely and is immutable" >&2
            exit 1
          fi

      - name: Publish validated template release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.contract.outputs.release_tag }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          GODOT_COMMIT: ${{ steps.source.outputs.commit }}
          BRIDGE_ABI: ${{ steps.contract.outputs.bridge_abi }}
          TEMPLATE_SCHEMA: ${{ steps.contract.outputs.template_schema }}
        run: |
          set -euo pipefail
          # Template releases must never become "Latest": releases/latest is
          # the plugin download link used by the README and the website.
          gh release create "$RELEASE_TAG" \
            "$BUNDLE_PATH" \
            "${BUNDLE_PATH}.sha256" \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Mini-Game Template ${GODOT_TAG} / Emscripten ${EMSDK_VERSION} / ABI ${BRIDGE_ABI} / r${TEMPLATE_REVISION}" \
            --notes "Validated profile=${BUILD_PROFILE}, target=${BUILD_TARGET}, templateSchema=${TEMPLATE_SCHEMA}. Exact Godot source commit: ${GODOT_COMMIT}."
