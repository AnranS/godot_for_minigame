<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="hero-light-title hero-light-desc" preserveAspectRatio="xMidYMid meet">
  <title id="hero-light-title">Godot Mini Game export flow</title>
  <desc id="hero-light-desc">A Godot project flows through the export plugin to WeChat and Douyin Mini Games.</desc>
  <defs>
    <linearGradient id="hero-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f6fb"/>
    </linearGradient>
    <linearGradient id="hero-light-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#478cbf"/>
      <stop offset="0.55" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <radialGradient id="hero-light-blue-glow">
      <stop offset="0" stop-color="#478cbf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#478cbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-light-green-glow">
      <stop offset="0" stop-color="#07c160" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07c160" stop-opacity="0"/>
