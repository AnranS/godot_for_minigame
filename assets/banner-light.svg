    <pattern id="hero-light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d8dee4" stroke-width="0.7" stroke-opacity="0.7"/>
    </pattern>
    <filter id="hero-light-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <marker id="hero-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6e7781"/>
    </marker>
    <clipPath id="hero-light-clip">
      <rect x="1" y="1" width="718" height="178" rx="18"/>
    </clipPath>
  </defs>

