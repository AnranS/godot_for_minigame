<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="architecture-zh-title architecture-zh-desc" preserveAspectRatio="xMidYMid meet" lang="zh-CN" xml:lang="zh-CN">
  <title id="architecture-zh-title">Godot Mini Game 系统架构</title>
  <desc id="architecture-zh-desc">导出控制面会验证精确引擎模板，在暂存区装配单个目标平台，验证所有权和哈希，并在锁内发布受管路径。导出产物运行时再通过 PlatformRuntime 和带版本契约的 JavaScript 与 GDScript Bridge 工作。</desc>
  <defs>
    <linearGradient id="architecture-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080f1a"/>
      <stop offset="1" stop-color="#0d1726"/>
    </linearGradient>
    <linearGradient id="architecture-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b2b"/>
      <stop offset="1" stop-color="#101a27"/>
    </linearGradient>
    <linearGradient id="architecture-card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#152338"/>
      <stop offset="1" stop-color="#111d2d"/>
    </linearGradient>
    <linearGradient id="architecture-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#478cbf"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="architecture-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#233249" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <filter id="architecture-shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6e91ad"/>
    </marker>
    <clipPath id="architecture-clip">
      <rect x="1" y="1" width="718" height="978" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#architecture-clip)">
    <rect width="720" height="980" fill="url(#architecture-bg)"/>
    <rect width="720" height="980" fill="url(#architecture-grid)"/>
    <circle cx="70" cy="40" r="180" fill="#478cbf" fill-opacity="0.06"/>
    <circle cx="690" cy="820" r="210" fill="#34d399" fill-opacity="0.045"/>
  </g>
  <rect x="0.5" y="0.5" width="719" height="979" rx="22" fill="none" stroke="#303d50"/>

  <text x="36" y="43" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="27" font-weight="700">系统架构</text>
  <text x="36" y="68" fill="#9fb0c3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">单次选择一个导出目标 · 两个执行平面 · 显式版本契约</text>
  <rect x="36" y="78" width="648" height="2" rx="1" fill="url(#architecture-accent)"/>

  <g id="plane-export">
    <rect x="26" y="94" width="668" height="566" rx="20" fill="url(#architecture-panel)" stroke="#29445f"/>
    <circle cx="50" cy="121" r="5" fill="#60a5fa"/>
    <text x="64" y="127" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">导出控制面</text>

    <g id="stage-input" filter="url(#architecture-shadow)">
      <rect x="50" y="144" width="620" height="55" rx="14" fill="url(#architecture-card)" stroke="#2d4764"/>
      <circle cx="76" cy="171" r="16" fill="#478cbf"/>
      <text x="76" y="177" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">01</text>
      <text x="104" y="166" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">项目与导出入口</text>
      <text x="104" y="187" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">Godot 项目 + Web preset → Export Dock 或 headless script → exporter.gd</text>
    </g>
    <path d="M360 199V214" stroke="#6e91ad" stroke-width="2" marker-end="url(#architecture-arrow)"/>

    <g id="stage-preflight" filter="url(#architecture-shadow)">
      <rect x="50" y="219" width="620" height="67" rx="14" fill="url(#architecture-card)" stroke="#36526e"/>
      <circle cx="76" cy="252" r="16" fill="#5b7fa3"/>
      <text x="76" y="258" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">02</text>
      <text x="104" y="246" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">预检与精确模板解析</text>
      <text x="104" y="270" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">OutputGuard + 完整 TemplateBundle；版本或哈希不匹配即关闭</text>
    </g>
    <path d="M360 286V301" stroke="#6e91ad" stroke-width="2" marker-end="url(#architecture-arrow)"/>

    <g id="stage-staging" filter="url(#architecture-shadow)">
      <rect x="50" y="306" width="620" height="76" rx="14" fill="url(#architecture-card)" stroke="#385a77"/>
      <circle cx="76" cy="344" r="16" fill="#3975a5"/>
      <text x="76" y="350" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">03</text>
      <text x="104" y="336" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">同级暂存区装配</text>
      <text x="104" y="359" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">PCK + 已校验 JS/WASM 引擎对 + 公共运行时模板</text>
      <text x="104" y="377" fill="#7f93a8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14">所有产物都先在最终输出目录之外完成装配。</text>
    </g>
    <path d="M360 382V397" stroke="#6e91ad" stroke-width="2" marker-end="url(#architecture-arrow)"/>

    <g id="stage-assembly" filter="url(#architecture-shadow)">
      <rect x="50" y="402" width="620" height="69" rx="14" fill="url(#architecture-card)" stroke="#3d6075"/>
      <circle cx="76" cy="436" r="16" fill="#368c9a"/>
      <text x="76" y="442" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">04</text>
      <text x="104" y="430" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">选择一套平台模板</text>
      <text x="104" y="454" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">一次导出事务只生成一个目标包。</text>
      <g id="target-wechat">
        <rect x="500" y="416" width="70" height="29" rx="14.5" fill="#07c160" fill-opacity="0.16" stroke="#218b52"/>
        <text x="535" y="436" text-anchor="middle" fill="#58d68b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700">wx</text>
      </g>
      <text x="579" y="436" text-anchor="middle" fill="#71859a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">或</text>
      <g id="target-douyin">
        <rect x="602" y="416" width="48" height="29" rx="14.5" fill="#fe2c55" fill-opacity="0.14" stroke="#a4415a"/>
        <text x="626" y="436" text-anchor="middle" fill="#ff7c97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700">tt</text>
      </g>
    </g>
    <path d="M360 471V486" stroke="#6e91ad" stroke-width="2" marker-end="url(#architecture-arrow)"/>

    <g id="stage-validation" filter="url(#architecture-shadow)">
      <rect x="50" y="491" width="620" height="61" rx="14" fill="url(#architecture-card)" stroke="#3e6c72"/>
      <circle cx="76" cy="521" r="16" fill="#24887b"/>
      <text x="76" y="527" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">05</text>
      <text x="104" y="515" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">Manifest、哈希与所有权验证</text>
      <text x="104" y="539" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">先验证暂存包，再获取锁并复核目标目录状态。</text>
    </g>
    <path d="M360 552V567" stroke="#6e91ad" stroke-width="2" marker-end="url(#architecture-arrow)"/>

    <g id="stage-publish" filter="url(#architecture-shadow)">
      <rect x="50" y="572" width="620" height="67" rx="14" fill="#102a27" stroke="#2c7a68"/>
      <circle cx="76" cy="605" r="16" fill="#1f9d73"/>
      <text x="76" y="611" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">06</text>
      <text x="104" y="599" fill="#eafff8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">锁内发布受管路径</text>
      <text x="104" y="623" fill="#a9d8c9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">旧路径移入 backup；进程内失败回滚；顶层 sidecars 原样保留。</text>
    </g>
  </g>

  <g id="plane-runtime">
    <rect x="26" y="676" width="668" height="216" rx="20" fill="url(#architecture-panel)" stroke="#315546"/>
    <circle cx="50" cy="704" r="5" fill="#34d399"/>
    <text x="64" y="710" fill="#56d39b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">导出产物运行时</text>

    <g id="stage-runtime" filter="url(#architecture-shadow)">
      <rect x="50" y="727" width="620" height="68" rx="14" fill="url(#architecture-card)" stroke="#356858"/>
      <text x="72" y="755" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="20" font-weight="650">game.js → PlatformRuntime → 唯一 Provider</text>
      <text x="72" y="780" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="15">adapter、fetch、loader 与 SDK 共用同一份 wx 或 tt 能力映射。</text>
    </g>
    <path d="M360 795V810" stroke="#6e91ad" stroke-width="2" marker-end="url(#architecture-arrow)"/>

    <g id="stage-bridge" filter="url(#architecture-shadow)">
      <rect x="50" y="815" width="620" height="58" rx="14" fill="#142334" stroke="#46617a"/>
      <text x="72" y="841" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="19" font-weight="650">Loader 启动引擎 + PCK · GodotSDK ⇄ Bridge ABI ⇄ MiniGameSDK</text>
      <text x="72" y="863" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14">brand、全局名称、ABI 与必需方法匹配后，才绑定生命周期。</text>
    </g>
  </g>

  <g id="version-contract">
    <rect x="26" y="912" width="668" height="49" rx="14" fill="#111c2b" stroke="#3f5268"/>
    <text x="48" y="934" fill="#79c0ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="14" font-weight="700">精确模板契约</text>
    <text x="48" y="953" fill="#a9bacb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif" font-size="13">schema · Godot 版本 + commit · Emscripten · profile · target · revision · ABI · 特性开关 · JS/WASM 哈希</text>
  </g>
</svg>
